[project]
name = "stockwatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adhham Zaatri", email = "arzaatri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apache-flink>=2.2",
    "click>=8.4.2",
    "kafka-python>=3.0.8",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.2.7",
    "langgraph>=1.2.9",
    "lxml>=6.1.1",
    "pandas>=1.3.0,<2.3",
    "polars>=1.42.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "sqlalchemy>=2.0.51",
    "yfinance>=1.5.1",
]

[project.scripts]
stockwatch = "stockwatch.pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.22",
]
